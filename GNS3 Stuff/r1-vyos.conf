# INTERFACES ================================
set interfaces ethernet eth1 address 'dhcp'
set interfaces ethernet eth1 description 'WAN - Internet/NAT'
set interfaces ethernet eth0 description 'LAN trunk to SW1 - VLANs 10/20/30'
set interfaces ethernet eth0 vif 10 address '10.10.10.1/24'
set interfaces ethernet eth0 vif 10 description 'VLAN 10 - IT'
set interfaces ethernet eth0 vif 20 address '10.10.20.1/24'
set interfaces ethernet eth0 vif 20 description 'VLAN 20 - Production'
set interfaces ethernet eth0 vif 30 address '10.10.30.1/24'
set interfaces ethernet eth0 vif 30 description 'VLAN 30 - Servers'
set interfaces ethernet eth2 address '10.10.99.1/24'
set interfaces ethernet eth2 description 'DMZ - Web Server'

# DHCP ===========================
set service dhcp-server shared-network-name 'VLAN10' subnet '10.10.10.0/24' subnet-id '10'
set service dhcp-server shared-network-name 'VLAN10' subnet '10.10.10.0/24' option default-router '10.10.10.1'
set service dhcp-server shared-network-name 'VLAN10' subnet '10.10.10.0/24' option name-server '8.8.8.8'
set service dhcp-server shared-network-name 'VLAN10' subnet '10.10.10.0/24' range '0' start '10.10.10.100'
set service dhcp-server shared-network-name 'VLAN10' subnet '10.10.10.0/24' range '0' stop '10.10.10.200'
set service dhcp-server shared-network-name 'VLAN20' subnet '10.10.20.0/24' subnet-id '20'
set service dhcp-server shared-network-name 'VLAN20' subnet '10.10.20.0/24' option default-router '10.10.20.1'
set service dhcp-server shared-network-name 'VLAN20' subnet '10.10.20.0/24' option name-server '8.8.8.8'
set service dhcp-server shared-network-name 'VLAN20' subnet '10.10.20.0/24' range '0' start '10.10.20.100'
set service dhcp-server shared-network-name 'VLAN20' subnet '10.10.20.0/24' range '0' stop '10.10.20.200'

# NAT =========================
set nat source rule 100 outbound-interface name 'eth1'
set nat source rule 100 source address '10.10.0.0/16'
set nat source rule 100 translation address 'masquerade'
set nat destination rule 10 inbound-interface name 'eth1'
set nat destination rule 10 protocol 'tcp'
set nat destination rule 10 destination port '80'
set nat destination rule 10 translation address '10.10.99.10'

# FIREWALL - GLOBAL =========================
set firewall global-options state-policy established action 'accept'
set firewall global-options state-policy related action 'accept'
set firewall global-options state-policy invalid action 'drop'

# FIREWALL - ZONES =========================
set firewall zone IT member interface 'eth0.10'
set firewall zone PROD member interface 'eth0.20'
set firewall zone SRV member interface 'eth0.30'
set firewall zone DMZ member interface 'eth2'
set firewall zone WAN member interface 'eth1'
set firewall zone LOCAL local-zone

# ROUTER-ORIGINATED TRAFFIC =========================
set firewall zone WAN from LOCAL firewall name 'TO-WAN'
set firewall ipv4 name TO-WAN default-action 'drop'
set firewall ipv4 name TO-WAN rule 10 action 'accept'
set firewall ipv4 name TO-WAN rule 10 description 'Permit outbound Internet'
set firewall ipv4 name LOCAL-WAN default-action 'accept' #Needed?
set system name-server 8.8.8.8
set system name-server 1.1.1.1

# To SERVERS =========================
set firewall ipv4 name To-SRV default-action 'drop'
set firewall ipv4 name To-SRV rule 10 action 'accept'
set firewall ipv4 name To-SRV rule 10 destination address '10.10.30.0/24'
set firewall ipv4 name To-SRV rule 10 description 'Access to server VLAN'
set firewall zone SRV from PROD firewall name 'To-SRV'
set firewall zone SRV from IT firewall name 'To-SRV'

# To > DMZ =========================
set firewall ipv4 name To-DMZ default-action 'drop'
set firewall ipv4 name To-DMZ rule 10 action 'accept'
set firewall ipv4 name To-DMZ rule 10 destination address '10.10.99.0/24'
set firewall ipv4 name To-DMZ rule 10 description 'Access to DMZ'
set firewall zone DMZ from PROD firewall name 'To-DMZ'

# WAN > DMZ =========================
set firewall ipv4 name WAN-DMZ default-action 'drop'
set firewall ipv4 name WAN-DMZ rule 10 action 'accept'
set firewall ipv4 name WAN-DMZ rule 10 protocol 'tcp'
set firewall ipv4 name WAN-DMZ rule 10 destination address '10.10.99.10'
set firewall ipv4 name WAN-DMZ rule 10 destination port '80'
set firewall ipv4 name WAN-DMZ rule 10 description 'Web Server HTTP'
set firewall zone DMZ from WAN firewall name 'WAN-DMZ'

# VLANS > ROUTER =========================
set firewall ipv4 name TO-LOCAL default-action 'drop'
set firewall ipv4 name TO-LOCAL rule 10 action 'accept'
set firewall ipv4 name TO-LOCAL rule 10 protocol 'udp'
set firewall ipv4 name TO-LOCAL rule 10 destination port '53,67,68'
set firewall ipv4 name TO-LOCAL rule 10 description 'DNS and DHCP'
set firewall ipv4 name TO-LOCAL rule 20 action 'accept'
set firewall ipv4 name TO-LOCAL rule 20 protocol 'icmp'
set firewall ipv4 name TO-LOCAL rule 20 description 'Ping router'
set firewall ipv4 name TO-LOCAL rule 30 action 'accept'
set firewall ipv4 name TO-LOCAL rule 30 protocol 'tcp'
set firewall ipv4 name TO-LOCAL rule 30 destination port '22'
set firewall ipv4 name TO-LOCAL rule 30 description 'SSH to router'
#Apply Rules to VLANs
set firewall zone LOCAL from PROD firewall name 'TO-LOCAL'
set firewall zone LOCAL from SRV firewall name 'TO-LOCAL'
set firewall zone LOCAL from IT firewall name 'TO-LOCAL'

# INTERNET EGRESS =========================
set firewall zone WAN from IT firewall name 'TO-WAN'
set firewall zone WAN from PROD firewall name 'TO-WAN'
set firewall zone WAN from SRV firewall name 'TO-WAN'
set firewall zone WAN from DMZ firewall name 'TO-WAN'
set firewall zone WAN from LOCAL firewall name 'LOCAL-WAN'

# Everything above this is working ==========================================================
# Everything below needs to be modified with new variables ==================================

# VPN =====================================
# IPsec site-to-site VPN to AWS
# IKE - Match AWS tunnel configuration
set vpn ipsec ike-group AWS-IKE key-exchange 'ikev2'
set vpn ipsec ike-group AWS-IKE lifetime '28800'
set vpn ipsec ike-group AWS-IKE proposal 1 encryption 'aes128'
set vpn ipsec ike-group AWS-IKE proposal 1 hash 'sha1'
set vpn ipsec ike-group AWS-IKE proposal 1 dh-group '2'

# ESP - Match AWS tunnel configuration
set vpn ipsec esp-group AWS-ESP lifetime '3600'
set vpn ipsec esp-group AWS-ESP pfs 'dh-group2'
set vpn ipsec esp-group AWS-ESP proposal 1 encryption 'aes128'
set vpn ipsec esp-group AWS-ESP proposal 1 hash 'sha1'

# Enable IPsec on WAN, NAT-T
set vpn ipsec interface 'eth1'
set vpn ipsec options disable-route-autoinstall

# VTI interface
set interfaces vti vti0 address '{TUNNEL1_INSIDE_CGW_IP}/30'
set interfaces vti vti0 description 'IPsec tunnel 1 to AWS'
set interfaces vti vti0 mtu '1436'
set interfaces vti vti0 ip adjust-mss '1379'

# Global PSK
set vpn ipsec authentication psk AWS-PSK id '{PUBLIC_EGRESS_IP}'
set vpn ipsec authentication psk AWS-PSK id '{AWS_TUNNEL1_OUTSIDE_IP}'
set vpn ipsec authentication psk AWS-PSK secret '{PSK1}'

# Site-to-site peer
set vpn ipsec site-to-site peer AWS-TUN1 authentication mode 'pre-shared-secret'
set vpn ipsec site-to-site peer AWS-TUN1 authentication local-id '{PUBLIC_EGRESS_IP}'
set vpn ipsec site-to-site peer AWS-TUN1 authentication remote-id '{AWS_TUNNEL1_OUTSIDE_IP}'
set vpn ipsec site-to-site peer AWS-TUN1 remote-address '{AWS_TUNNEL1_OUTSIDE_IP}'
set vpn ipsec site-to-site peer AWS-TUN1 local-address '{R1_WAN_IP}'
set vpn ipsec site-to-site peer AWS-TUN1 ike-group 'AWS-IKE'
set vpn ipsec site-to-site peer AWS-TUN1 connection-type 'initiate'
set vpn ipsec site-to-site peer AWS-TUN1 vti bind 'vti0'
set vpn ipsec site-to-site peer AWS-TUN1 vti esp-group 'AWS-ESP'

# Route AWS VPC
set protocols static route 10.2.0.0/16 next-hop '{TUNNEL1_INSIDE_VGW_IP}'

# VPN firewall
set firewall zone VPN member interface 'vti0'
set firewall ipv4 name IT-VPN default-action 'drop'
set firewall ipv4 name IT-VPN rule 10 action 'accept'
set firewall ipv4 name IT-VPN rule 10 destination address '10.2.0.0/16'
set firewall ipv4 name IT-VPN rule 10 description 'IT to AWS VPC (TC8)'
set firewall zone VPN from IT firewall name 'IT-VPN'

# COMMIT / SAVE =========================
commit
save

